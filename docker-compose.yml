services:
  db:
    container_name: fmis-db
    env_file:
      - .env.local
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fmis -d fmis_db']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: fmis-api
    env_file:
      - .env.local
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata: